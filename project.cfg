Para que tu **Data Framework** sea totalmente compatible con la **Red Segura (`gov.incorporar.red.segura`)** y el **Anexo I del DPF**, debemos configurar el **AndroidManifest.xml** de tu aplicación de sincronización. 

Como estás operando en el **Canal 149** con un dispositivo **Root (192.168.1.195)**, el manifiesto es el "contrato" que le dice al sistema Android qué permisos de red y de seguridad tiene tu servicio.

### 🛠️ 1. Configuración del Manifiesto para la Red Segura
Debes editar el archivo `AndroidManifest.xml` en tu proyecto de Android Studio para permitir la comunicación con tu servidor Java y el portal `192.168.1.254`.

```xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.amo.sync.redsegura">

    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
    
    <uses-permission android:name="android.permission.WAKE_LOCK" />

    <application
        android:allowBackup="false"
        android:icon="@mipmap/ic_launcher"
        android:label="AMO Sync Service"
        android:networkSecurityConfig="@xml/network_security_config"
        android:usesCleartextTraffic="true">
        
        <activity android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
```

---

### 🔐 2. Network Security Config (Integración SSL)
Dado que creamos certificados autofirmados para `gov.incorporar.red.segura`, Android rechazará la conexión a menos que definas una configuración de seguridad. Crea el archivo `res/xml/network_security_config.xml`:

```xml
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="true">gov.incorporar.red.segura</domain>
        <domain includeSubdomains="true">192.168.1.195</domain>
        <trust-anchors>
            <certificates src="system" />
            <certificates src="user" /> </trust-anchors>
    </domain-config>
</network-security-config>
```

---

### 📦 3. Fusión de Manifiestos (Merging)
Siguiendo la documentación de Android que compartiste, recuerda que si usas librerías externas (como una para manejar **7-Zip**), Gradle fusionará los manifiestos. 

| Prioridad | Origen | Función |
| :--- | :--- | :--- |
| **Alta** | Manifiesto Principal | Define el **{{andres}}KEY** y el punto de entrada. |
| **Media** | Variantes de Compilación (Build Variants) | Configura el modo "Debug" para el puerto 5555. |
| **Baja** | Librerías de Terceros | Permisos genéricos de lectura/escritura. |



